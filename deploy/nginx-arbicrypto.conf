# nginx para ArbiCrypto. Copiar a /etc/nginx/sites-available/arbicrypto y cambiar TU-DOMINIO.com
# Luego:  ln -s /etc/nginx/sites-available/arbicrypto /etc/nginx/sites-enabled/  &&  nginx -t  &&  systemctl reload nginx
# El certificado HTTPS lo pone certbot:  certbot --nginx -d TU-DOMINIO.com

upstream arbicrypto {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name TU-DOMINIO.com;
    # certbot agrega aqui la redireccion a https
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TU-DOMINIO.com;

    # certbot completa estas dos lineas
    # ssl_certificate     /etc/letsencrypt/live/TU-DOMINIO.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/TU-DOMINIO.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;   # el panel no recibe archivos
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # comun a todo: el panel ve la IP real del visitante (no la de nginx) y que la conexion es https
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # $remote_addr (no $proxy_add_x_forwarded_for): nadie puede falsear su IP
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # eventos en vivo: sin buffer y con conexion larga, si no el panel deja de actualizarse
    location = /api/events {
        proxy_pass http://arbicrypto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    # archivos de la interfaz: se pueden guardar en cache (llevan huella en el nombre)
    location /_next/static/ {
        proxy_pass http://arbicrypto;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://arbicrypto;
        proxy_read_timeout 60s;
    }
}
