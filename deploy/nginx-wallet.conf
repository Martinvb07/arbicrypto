# nginx para ArbiCrypto Wallet (contabilidad e impuestos). Copiar a /etc/nginx/sites-available/arbicrypto-wallet
# Luego:  ln -s /etc/nginx/sites-available/arbicrypto-wallet /etc/nginx/sites-enabled/  &&  nginx -t  &&  systemctl reload nginx
# El certificado HTTPS lo pone certbot:  certbot --nginx -d wallet.arbicrypto.org
# En wallet/backend/.env:  ALLOWED_HOSTS=wallet.arbicrypto.org  y  COOKIE_SECURE=1

upstream arbicrypto_wallet {
    server 127.0.0.1:8788;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name wallet.arbicrypto.org;
    # certbot agrega aqui la redireccion a https
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wallet.arbicrypto.org;

    # certbot completa estas dos lineas
    # ssl_certificate     /etc/letsencrypt/live/wallet.arbicrypto.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/wallet.arbicrypto.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 16m;   # extractos bancarios en PDF o Excel (hasta 12 MB, llegan en base64)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/csv;

    # comun a todo: la wallet ve la IP real del visitante (no la de nginx) y que la conexion es https
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # $remote_addr (no $proxy_add_x_forwarded_for): nadie puede falsear su IP
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # archivos de la interfaz: se pueden guardar en cache (llevan huella en el nombre)
    location /_next/static/ {
        proxy_pass http://arbicrypto_wallet;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # el Excel para la DIAN y el paquete del contador tardan unos segundos en armarse
    location / {
        proxy_pass http://arbicrypto_wallet;
        proxy_read_timeout 120s;
    }
}
