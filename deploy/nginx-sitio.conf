# nginx para la portada de ArbiCrypto (arbicrypto.org) y su login. Copiar a /etc/nginx/sites-available/arbicrypto-sitio
# Luego:  ln -s /etc/nginx/sites-available/arbicrypto-sitio /etc/nginx/sites-enabled/  &&  nginx -t  &&  systemctl reload nginx
# El certificado HTTPS lo pone certbot:  certbot --nginx -d arbicrypto.org -d www.arbicrypto.org
#
# La portada la sirve el mismo panel (127.0.0.1:8787): con SITE_DOMAIN=arbicrypto.org en backend/.env, en este dominio
# solo responde la portada, el login y los precios públicos; todo lo demás manda a panel.arbicrypto.org.

upstream arbicrypto_sitio {
    server 127.0.0.1:8787;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name arbicrypto.org www.arbicrypto.org;
    # certbot agrega aqui la redireccion a https
    location / { return 301 https://arbicrypto.org$request_uri; }
}

# www.arbicrypto.org -> arbicrypto.org (una sola dirección para los buscadores)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.arbicrypto.org;
    # certbot completa estas dos lineas
    # ssl_certificate     /etc/letsencrypt/live/arbicrypto.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/arbicrypto.org/privkey.pem;
    return 301 https://arbicrypto.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arbicrypto.org;

    # certbot completa estas dos lineas
    # ssl_certificate     /etc/letsencrypt/live/arbicrypto.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/arbicrypto.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;   # solo el formulario de login
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;   # $remote_addr (no $proxy_add_x_forwarded_for): nadie puede falsear su IP
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location /_next/static/ {
        proxy_pass http://arbicrypto_sitio;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://arbicrypto_sitio;
        proxy_read_timeout 30s;
    }
}
